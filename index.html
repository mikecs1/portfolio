    <script>
        // Function to set random images for different sections
        function setRandomImage(sectionId, imageArray) {
            // Select a random image from the array
            const randomIndex = Math.floor(Math.random() * imageArray.length);
            const randomImage = imageArray[randomIndex];

            document.getElementById(sectionId).src = randomImage;
        }

        // Call the random image function on load for each section
        function setAllRandomImages() {
            // Define arrays of images for each section
            const codeImages = [
                "code2.png",
                "code5.png",
            ];

            const graphicsImages = [
                "graphics1.png",
                "graphics2.png",
                "graphics3.png",
                "graphics4.png",
                "graphics5.png",
                "graphics6.png",
            ];

            const aboutImages = [
                "about1.png"
            ];

            // random images for each refresh
            setRandomImage('codeImage', codeImages);
            setRandomImage('graphicsImage', graphicsImages);
            setRandomImage('aboutImage', aboutImages);
        }
    </script>
</head>
